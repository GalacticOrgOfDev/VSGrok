name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check-types
      - run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:unit
      - name: Cache VS Code test build
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-stable
      - name: Integration tests (real VS Code, headless)
        run: xvfb-run -a pnpm run test:integration
      - name: Package vsix
        run: npx --yes @vscode/vsce package --no-dependencies -o vsgrok-ci.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsgrok-ci-vsix
          path: vsgrok-ci.vsix
